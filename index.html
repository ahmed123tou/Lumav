<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>"
    >

    <title>Luma — Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="star-field"></div>
    </div>

    <main class="auth-container">

        <section class="auth-card">

            <!-- LUMA LOGO -->
            <div class="brand">
                <div class="brand-icon">✦</div>
                <span>Luma</span>
            </div>


            <!-- =========================
                 LOGIN
            ========================== -->

            <div class="auth-form active" id="loginForm">

                <div class="heading">
                    <h1>Welcome back!</h1>
                    <p>We're so excited to see you again!</p>
                </div>

                <form id="login">

                    <!-- USERNAME -->
                    <div class="field">

                        <label for="loginUsername">
                            USERNAME <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="field">

                        <label for="loginPassword">
                            PASSWORD <span>*</span>
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="loginPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        class="primary-btn"
                        type="submit"
                    >
                        <span class="btn-text">
                            Log In
                        </span>

                        <span class="loader"></span>
                    </button>


                    <div
                        class="error-message"
                        id="loginError"
                    ></div>

                </form>


                <!-- CREATE ACCOUNT -->
                <div class="switch">

                    <span>Don't have an account?</span>

                    <button
                        type="button"
                        id="showSignup"
                    >
                        Create a new account
                    </button>

                </div>

            </div>


            <!-- =========================
                 SIGNUP
            ========================== -->

            <div class="auth-form" id="signupForm">

                <div class="heading">
                    <h1>Create an account</h1>
                    <p>Join Luma and start hanging out.</p>
                </div>


                <form id="signup">

                    <!-- USERNAME -->
                    <div class="field">

                        <label for="signupUsername">
                            USERNAME <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="signupUsername"
                            placeholder="Choose a username"
                            maxlength="24"
                            autocomplete="username"
                            required
                        >

                        <small>
                            2–24 characters
                        </small>

                    </div>


                    <!-- DISPLAY NAME -->
                    <div class="field">

                        <label for="displayName">
                            DISPLAY NAME <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="displayName"
                            placeholder="Choose a display name"
                            maxlength="32"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="field">

                        <label for="signupPassword">
                            PASSWORD <span>*</span>
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="signupPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="signupPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                        <small>
                            At least 6 characters
                        </small>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="field">

                        <label for="confirmPassword">
                            CONFIRM PASSWORD <span>*</span>
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- CREATE ACCOUNT -->
                    <button
                        class="primary-btn"
                        type="submit"
                    >

                        <span class="btn-text">
                            Create Account
                        </span>

                        <span class="loader"></span>

                    </button>


                    <div
                        class="error-message"
                        id="signupError"
                    ></div>

                </form>


                <!-- BACK TO LOGIN -->
                <div class="switch">

                    <span>Already have an account?</span>

                    <button
                        type="button"
                        id="showLogin"
                    >
                        Log In
                    </button>

                </div>

            </div>

        </section>

    </main>


    <div
        class="toast"
        id="toast"
    ></div>


    <script src="script.js"></script>

</body>
</html>
