<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Luma — Login</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='72%25' text-anchor='middle' font-size='70'%3E🌙%3C/text%3E%3C/svg%3E"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="stars"></div>

    </div>


    <!-- AUTH -->

    <main class="auth-container">

        <section class="auth-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <span>
                    Luma
                </span>

            </div>


            <!-- ==================================================
                 LOGIN
            ================================================== -->

            <div
                class="auth-form active"
                id="loginForm"
            >

                <div class="heading">

                    <h1>
                        Welcome back!
                    </h1>

                    <p>
                        We're so excited to see you again!
                    </p>

                </div>


                <form id="login">

                    <!-- USERNAME -->

                    <div class="field">

                        <label>
                            USERNAME <span>*</span>
                        </label>

                        <input
                            id="loginUsername"
                            type="text"
                            placeholder="Enter your username"
                            autocomplete="username"
                            maxlength="24"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <label>
                            PASSWORD <span>*</span>
                        </label>


                        <div class="password-box">

                            <input
                                id="loginPassword"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="eye-button"
                                data-password="loginPassword"
                                aria-label="Show password"
                                title="Show password"
                            >

                                <!-- OPEN EYE -->

                                <svg
                                    class="eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />

                                </svg>


                                <!-- CLOSED EYE -->

                                <svg
                                    class="eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M3 3l18 18"
                                    />

                                    <path
                                        d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6.2 0 9.8 6 9.8 6a17.5 17.5 0 0 1-3.2 3.8"
                                    />

                                    <path
                                        d="M6.2 8.2C3.7 10 2.2 12 2.2 12s3.6 6 9.8 6c1.1 0 2.1-.2 3-.5"
                                    />

                                    <path
                                        d="M9.8 9.8a3 3 0 0 0 4.4 4.4"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <button
                        class="primary-btn"
                        type="submit"
                    >

                        <span class="btn-text">
                            Log In
                        </span>

                        <span class="loader"></span>

                    </button>


                    <div
                        class="error-message"
                        id="loginError"
                    ></div>

                </form>


                <div class="switch">

                    <span>
                        Don't have an account?
                    </span>

                    <button
                        type="button"
                        id="showSignup"
                    >
                        Create a new account
                    </button>

                </div>

            </div>



            <!-- ==================================================
                 SIGNUP
            ================================================== -->

            <div
                class="auth-form"
                id="signupForm"
            >

                <div class="heading">

                    <h1>
                        Create an account
                    </h1>

                    <p>
                        Join Luma and start hanging out.
                    </p>

                </div>


                <form id="signup">

                    <!-- USERNAME -->

                    <div class="field">

                        <label>
                            USERNAME <span>*</span>
                        </label>

                        <input
                            id="signupUsername"
                            type="text"
                            placeholder="Choose a username"
                            autocomplete="username"
                            maxlength="24"
                            required
                        >

                        <small>
                            Letters, numbers, _ and - only
                        </small>

                    </div>


                    <!-- DISPLAY NAME -->

                    <div class="field">

                        <label>
                            DISPLAY NAME <span>*</span>
                        </label>

                        <input
                            id="displayName"
                            type="text"
                            placeholder="Choose a display name"
                            maxlength="32"
                            required
                        >

                        <small>
                            Spaces and symbols are allowed
                        </small>

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <label>
                            PASSWORD <span>*</span>
                        </label>


                        <div class="password-box">

                            <input
                                id="signupPassword"
                                type="password"
                                placeholder="Letters and numbers only"
                                autocomplete="new-password"
                                maxlength="32"
                                required
                            >


                            <button
                                type="button"
                                class="eye-button"
                                data-password="signupPassword"
                                aria-label="Show password"
                                title="Show password"
                            >

                                <svg
                                    class="eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />

                                </svg>


                                <svg
                                    class="eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M3 3l18 18"
                                    />

                                    <path
                                        d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6.2 0 9.8 6 9.8 6a17.5 17.5 0 0 1-3.2 3.8"
                                    />

                                    <path
                                        d="M6.2 8.2C3.7 10 2.2 12 2.2 12s3.6 6 9.8 6c1.1 0 2.1-.2 3-.5"
                                    />

                                    <path
                                        d="M9.8 9.8a3 3 0 0 0 4.4 4.4"
                                    />

                                </svg>

                            </button>

                        </div>


                        <!-- GENERATOR -->

                        <button
                            type="button"
                            class="generate-password"
                            id="generatePassword"
                        >

                            <span class="generate-icon">
                                ✦
                            </span>

                            <span>
                                Generate a random password
                            </span>

                        </button>


                        <small>
                            6–32 characters • letters and numbers only
                        </small>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="field">

                        <label>
                            CONFIRM PASSWORD <span>*</span>
                        </label>


                        <div class="password-box">

                            <input
                                id="confirmPassword"
                                type="password"
                                placeholder="Enter your password again"
                                autocomplete="new-password"
                                maxlength="32"
                                required
                            >


                            <button
                                type="button"
                                class="eye-button"
                                data-password="confirmPassword"
                                aria-label="Show password"
                                title="Show password"
                            >

                                <svg
                                    class="eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />

                                </svg>


                                <svg
                                    class="eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M3 3l18 18"
                                    />

                                    <path
                                        d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6.2 0 9.8 6 9.8 6a17.5 17.5 0 0 1-3.2 3.8"
                                    />

                                    <path
                                        d="M6.2 8.2C3.7 10 2.2 12 2.2 12s3.6 6 9.8 6c1.1 0 2.1-.2 3-.5"
                                    />

                                    <path
                                        d="M9.8 9.8a3 3 0 0 0 4.4 4.4"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <button
                        class="primary-btn"
                        type="submit"
                    >

                        <span class="btn-text">
                            Create Account
                        </span>

                        <span class="loader"></span>

                    </button>


                    <div
                        class="error-message"
                        id="signupError"
                    ></div>

                </form>


                <div class="switch">

                    <span>
                        Already have an account?
                    </span>

                    <button
                        type="button"
                        id="showLogin"
                    >
                        Log In
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast"
    ></div>


    <script src="script.js"></script>

</body>
</html>
